var ANCHOR=Date.UTC(2026,10,9);/* Monday of a glass-cleaning week */
function wkPar(y,m,d){return ((Math.floor((Date.UTC(y,m-1,d)-ANCHOR)/604800000)%2)+2)%2}
var RULES=[{id:'glass',title:'Glass cleaning',weekly:[3,4],phase:0},{id:'floor',title:'Floor cleaning',weekly:[3],phase:1},{id:'bottle',title:'Bottle inventory',monthly:2},{id:'linen',title:'Linen inventory',monthly:3},{id:'ose',title:'OS&E inventory',monthly:4}];
var canEdit=false,editing=false,dirty=false,saving=false,art=null,msg='',armClear=false;
var app=document.getElementById('app');

function esc(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function pad(n){return String(n).padStart(2,'0')}
function todayISO(){var d=new Date();return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function addDays(iso,n){var d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function fmt(iso){return iso?new Date(iso+'T00:00:00').toLocaleDateString('en-GB',{day:'numeric',month:'short'}):''}
function wk(iso){return iso?new Date(iso+'T00:00:00').toLocaleDateString('en-GB',{weekday:'short'}):''}
function fmtN(n){return Number(n).toLocaleString('en-US')}
function getP(p){return p.split('.').reduce(function(o,k){return o==null?o:o[k]},S)}
function setP(p,v){var ks=p.split('.'),last=ks.pop(),o=ks.reduce(function(o,k){return o[k]},S);o[last]=v}
function cur(){var h=location.hash.slice(1);return TABS.some(function(t){return t[0]===h})?h:'roster'}

var NEW={
  staff:function(){return {name:'',role:'',duty:'',shifts:['','','','','','','']}},
  upsell:function(){return {date:todayISO(),item:'',staff:'',qty:'1',sales:''}},
  trainings:function(){return {date:todayISO(),time:'',topic:'',trainer:'',notes:'',status:'pending'}},
  tasks:function(){return {title:'',owner:'',due:'',status:'todo'}},
  items:function(){return {name:'',desc:'',price:''}},
  sections:function(){return {name:'New section',items:[]}},
  info:function(){return {label:'',value:''}},
  standards:function(){return ''}
};

function inp(path,val,o){o=o||{};
  return '<input class="in" data-p="'+esc(path)+'"'+(o.r?' data-r="1"':'')+' type="'+(o.type||'text')+'" value="'+esc(val)+'"'+(o.ph?' placeholder="'+esc(o.ph)+'"':'')+(o.label?' aria-label="'+esc(o.label)+'"':'')+(o.id?' id="'+o.id+'"':'')+(o.mode?' inputmode="'+o.mode+'"':'')+'>';
}
function ta(path,val,o){o=o||{};
  var n=Math.max(3,String(val==null?'':val).split('\n').length);
  return '<textarea class="in" rows="'+n+'" data-p="'+esc(path)+'"'+(o.ph?' placeholder="'+esc(o.ph)+'"':'')+(o.label?' aria-label="'+esc(o.label)+'"':'')+'>'+esc(val)+'</textarea>';
}
function shiftHTML(v){return String(v).split('\n').map(function(l){return /^\s*vela\b/i.test(l)?'<span class="vela">'+esc(l.trim())+'</span>':esc(l.trim())}).join('\n')}
function delBtn(list,i,label){return '<button class="btn sm del" data-act="del" data-list="'+esc(list)+'" data-i="'+i+'" aria-label="Remove '+esc(label||'row')+'">Remove</button>'}
function addBtn(list,label){return '<button class="btn" data-act="add" data-list="'+esc(list)+'">+ '+esc(label)+'</button>'}
function head(title,sub,extra){return '<div class="sechead"><div><h2>'+esc(title)+'</h2>'+(sub?'<p>'+esc(sub)+'</p>':'')+'</div>'+(extra||'')+'</div>'}

/* ---------- Roster ---------- */
function vRoster(){
  var r=S.roster,t=todayISO();
  var dates=DAYS.map(function(_,i){return addDays(r.weekOf,i)});
  var extra=editing?'<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><label class="fl" for="weekOf">Week starts <input class="in" style="width:auto" id="weekOf" type="date" data-r="1" data-p="roster.weekOf" value="'+esc(r.weekOf)+'"></label>'+addBtn('roster.staff','Add staff')+'</div>':'';
  var h=head('Weekly roster',fmt(dates[0])+' – '+fmt(dates[6]),extra);
  var th='<th>Staff</th>'+dates.map(function(dt,i){return '<th class="'+(dates[i]===t?'tdy':'')+'">'+wk(dt)+'<small>'+fmt(dates[i])+'</small></th>'}).join('')+(editing?'<th></th>':'');
  var rows=r.staff.map(function(s,i){
    var who=editing?'<td class="who">'+inp('roster.staff.'+i+'.name',s.name,{ph:'Name',label:'Staff name'})+'<div style="height:4px"></div>'+inp('roster.staff.'+i+'.role',s.role,{ph:'Role',label:'Role'})+'</td>'
      :'<td class="who"><b>'+esc(s.name)+'</b><span>'+esc(s.role)+'</span></td>';
    var cells=DAYS.map(function(d,k){
      var v=s.shifts[k]||'';var tdy=dates[k]===t?' tdy':'';
      if(editing)return '<td class="sh'+tdy+'">'+ta('roster.staff.'+i+'.shifts.'+k,v,{ph:'OFF or times',label:s.name+' '+wk(dates[k])+' duty times, one per line'})+'</td>';
      var off=!v||/^off$/i.test(v.trim());
      var on=/^on$/i.test(v.trim());
      return '<td class="sh'+(off?' off':' on')+tdy+'">'+(off?'OFF':shiftHTML(v))+'</td>';
    }).join('');
    return '<tr>'+who+cells+(editing?'<td>'+delBtn('roster.staff',i,s.name||'staff')+'</td>':'')+'</tr>';
  }).join('');
  if(!r.staff.length)return h+'<p class="empty">No staff on this roster yet.'+(editing?'':' It will appear here once added.')+'</p>';
  return h+'<div class="scroll"><table class="roster"><thead><tr>'+th+'</tr></thead><tbody>'+rows+'</tbody></table></div>';
}

/* ---------- Upselling ---------- */
function upStats(){
  var rows=S.upsell;
  var q=0,s=0,byS={},byI={};
  rows.forEach(function(r){var qq=+r.qty||0,ss=+r.sales||0;q+=qq;s+=ss;var k=(r.staff||'').trim()||'Unassigned';byS[k]=(byS[k]||0)+ss;var it=(r.item||'').trim();if(it)byI[it]=(byI[it]||0)+qq});
  var top=Object.keys(byI).sort(function(a,b){return byI[b]-byI[a]})[0];
  var h='<div class="stats"><div><b>'+fmtN(q)+'</b><span>items sold</span></div><div><b>$'+fmtN(s)+'</b><span>total sales</span></div><div><b>'+esc(top||'–')+'</b><span>top item by quantity</span></div></div>';
  var names=Object.keys(byS).sort(function(a,b){return byS[b]-byS[a]});
  var max=Math.max(1,Math.max.apply(null,names.map(function(n){return byS[n]})));
  if(names.length)h+='<div class="bars"><h3>Sales by staff</h3>'+names.map(function(n){return '<div class="bar"><span>'+esc(n)+'</span><div><i style="width:'+Math.max(2,Math.round(byS[n]/max*100))+'%"></i></div><span>$'+fmtN(byS[n])+'</span></div>'}).join('')+'</div>';
  return h;
}
function vUpsell(){
  var h=head('Upselling records','',editing?addBtn('upsell','Add record'):'');
  var list=S.upsell.map(function(x,i){return {x:x,i:i}});
  if(!editing)list.sort(function(a,b){return (b.x.date||'').localeCompare(a.x.date||'')});
  var body=list.map(function(o){var x=o.x,i=o.i,p='upsell.'+i+'.';
    if(editing)return '<tr><td>'+inp(p+'date',x.date,{type:'date',label:'Date'})+'</td><td>'+inp(p+'item',x.item,{ph:'Item',label:'Item'})+'</td><td>'+inp(p+'staff',x.staff,{ph:'Staff',label:'Staff'})+'</td><td>'+inp(p+'qty',x.qty,{mode:'numeric',label:'Quantity'})+'</td><td>'+inp(p+'sales',x.sales,{mode:'decimal',ph:'Sales ($)',label:'Sales in dollars'})+'</td><td>'+delBtn('upsell',i,'record')+'</td></tr>';
    return '<tr><td>'+fmt(x.date)+'</td><td>'+esc(x.item)+'</td><td>'+esc(x.staff)+'</td><td class="num">'+esc(x.qty)+'</td><td class="num">'+(x.sales===''?'':'$'+fmtN(+x.sales||0))+'</td></tr>';
  }).join('');
  var tbl=S.upsell.length?'<div class="scroll"><table><thead><tr><th>Date</th><th>Item</th><th>Staff</th><th class="num">Qty</th><th class="num">Sales</th>'+(editing?'<th></th>':'')+'</tr></thead><tbody>'+body+'</tbody></table></div>':'<p class="empty">No upselling records yet.</p>';
  return h+'<div id="upstats">'+upStats()+'</div>'+tbl;
}

/* ---------- Training ---------- */
function tstat(x){return x.status==='completed'?'completed':'pending'}
function vTraining(){
  var mname=S.trainMonth?new Date(S.trainMonth+'-01T00:00:00').toLocaleDateString('en-GB',{month:'long',year:'numeric'}):'';
  var done=S.trainings.filter(function(x){return tstat(x)==='completed'}).length;
  var extra=editing?'<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><label class="fl" for="tm">Month <input class="in" style="width:auto" id="tm" type="month" data-r="1" data-p="trainMonth" value="'+esc(S.trainMonth)+'"></label>'+addBtn('trainings','Add training')+'</div>':'';
  var h=head('Trainings',mname+' · '+done+' completed, '+(S.trainings.length-done)+' pending',extra);
  var list=S.trainings.map(function(x,i){return {x:x,i:i}});
  if(!editing)list.sort(function(a,b){return (a.x.date||'').localeCompare(b.x.date||'')});
  if(!list.length)return h+'<p class="empty">No trainings added for this month yet.</p>';
  var rows=list.map(function(o){var x=o.x,i=o.i,p='trainings.'+i+'.',s=tstat(x),c=s==='completed';
    var chip='<span class="chip '+(c?'ok':'pend')+'">'+(c?'Completed':'Pending')+'</span>';
    var btn=canEdit?' <button class="btn sm" data-act="tstatus" data-i="'+i+'">'+(c?'Mark pending':'Mark completed')+'</button>':'';
    if(editing)return '<tr><td>'+inp(p+'date',x.date,{type:'date',label:'Date'})+'</td><td>'+inp(p+'time',x.time,{ph:'Time',label:'Time'})+'</td><td>'+inp(p+'topic',x.topic,{ph:'Topic',label:'Topic'})+'</td><td>'+inp(p+'trainer',x.trainer,{ph:'Trainer',label:'Trainer'})+'</td><td>'+inp(p+'notes',x.notes,{ph:'Notes',label:'Notes'})+'</td><td class="stc">'+chip+btn+'</td><td>'+delBtn('trainings',i,'training')+'</td></tr>';
    return '<tr class="'+(c?'tdone':'')+'"><td class="dcell">'+fmt(x.date)+'<small>'+wk(x.date)+'</small></td><td class="tm">'+esc(x.time)+'</td><td class="topic">'+esc(x.topic)+'</td><td>'+esc(x.trainer)+'</td><td class="notes">'+esc(x.notes)+'</td><td class="stc">'+chip+btn+'</td></tr>';
  }).join('');
  return h+'<div class="scroll"><table class="tsheet"><thead><tr><th>Date</th><th>Time</th><th>Training</th><th>Trainer</th><th>Notes</th><th>Status</th>'+(editing?'<th></th>':'')+'</tr></thead><tbody>'+rows+'</tbody></table></div>';
}

/* ---------- Checklist (current month only) ---------- */
function monthItems(){
  var t=todayISO(),y=+t.slice(0,4),m=+t.slice(5,7),last=new Date(y,m,0).getDate(),out=[];
  for(var d=1;d<=last;d++){
    var iso=y+'-'+pad(m)+'-'+pad(d),dow=new Date(y,m-1,d).getDay();
    RULES.forEach(function(r){
      if((r.weekly&&r.weekly.indexOf(dow)>-1&&wkPar(y,m,d-(dow+6)%7)===r.phase)||r.monthly===d)out.push({k:r.id+'|'+iso,title:r.title,date:iso,monthly:!!r.monthly});
    });
  }
  return out;
}
function vChecklist(){
  var t=todayISO(),items=monthItems();
  var done=items.filter(function(i){return S.done[i.k]}).length;
  var mname=new Date(t.slice(0,7)+'-01T00:00:00').toLocaleDateString('en-GB',{month:'long',year:'numeric'});
  var pct=items.length?Math.round(done/items.length*100):0;
  var rows=items.map(function(i){
    var isDone=!!S.done[i.k],late=!isDone&&i.date<t,today=i.date===t;
    var chip=isDone?'<span class="chip ok">Done</span>':(late?'<span class="chip bad">Overdue</span>':(today?'<span class="chip today">Today</span>':'<span class="chip up">Upcoming</span>'));
    var btn=canEdit?'<button class="btn sm tick'+(isDone?' on':'')+'" data-act="tick" data-k="'+esc(i.k)+'" aria-pressed="'+isDone+'">'+(isDone?'Undo':'Mark done')+'</button>':'';
    return '<li class="ck'+(isDone?' fin':'')+(today?' now':'')+'"><div class="dt"><b>'+(+i.date.slice(8,10))+'</b><span>'+wk(i.date)+'</span></div><div class="ctitle"><b>'+esc(i.title)+'</b><span>'+(i.monthly?'Monthly':'Every 2 weeks')+'</span></div><div class="cact">'+chip+btn+'</div></li>';
  }).join('');
  return head('Checklist',mname+' · '+done+' of '+items.length+' done','')+
    '<div class="prog" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><i style="width:'+pct+'%"></i></div>'+
    '<ul class="clist">'+rows+'</ul>';
}

/* ---------- Tasks ---------- */
function vTasks(){
  var t=todayISO();
  var h=head('Other tasks','Move a task between columns by changing its status',editing?addBtn('tasks','Add task'):'');
  var cols=COLS.map(function(c){
    var k=c[0],items=S.tasks.map(function(x,i){return {x:x,i:i}}).filter(function(o){return o.x.status===k});
    var cards=items.map(function(o){var x=o.x,i=o.i,p='tasks.'+i+'.';
      if(editing)return '<div class="card"><div class="ed">'+inp(p+'title',x.title,{ph:'Task',label:'Task'})+inp(p+'owner',x.owner,{ph:'Owner',label:'Owner'})+inp(p+'due',x.due,{type:'date',label:'Due date'})+'<select class="in" data-r="1" data-p="'+p+'status" aria-label="Status">'+COLS.map(function(cc){return '<option value="'+cc[0]+'"'+(cc[0]===x.status?' selected':'')+'>'+cc[1]+'</option>'}).join('')+'</select>'+delBtn('tasks',i,'task')+'</div></div>';
      var late=x.due&&x.due<t&&x.status!=='done';
      var meta=[x.owner?esc(x.owner):'',x.due?(late?'<span class="late">Overdue · '+fmt(x.due)+'</span>':'Due '+fmt(x.due)):''].filter(Boolean).join(' · ');
      return '<div class="card"><b>'+esc(x.title)+'</b>'+(meta?'<span class="m">'+meta+'</span>':'')+'</div>';
    }).join('')||'<p class="empty">Nothing here</p>';
    return '<section class="col '+k+'"><h3>'+c[1]+' <span class="count">'+items.length+'</span></h3>'+cards+'</section>';
  }).join('');
  return vChecklist()+h+'<div class="board">'+cols+'</div>';
}

/* ---------- Menu ---------- */
function vMenu(){
  var secs=S.menu.sections;
  var h=head('Menus','Three courses, à la carte',editing?addBtn('menu.sections','Add section'):'');
  if(!secs.length)return h+'<p class="empty">The menu has not been added yet.</p>';
  return h+'<div class="menugrid">'+secs.map(function(s,si){var sp='menu.sections.'+si+'.';
    var title=editing?'<div style="display:flex;gap:8px">'+inp(sp+'name',s.name,{label:'Section name'})+delBtn('menu.sections',si,'section')+'</div>':'<h3>'+esc(s.name)+'</h3>';
    var items=s.items.map(function(it,ii){var ip=sp+'items.'+ii+'.';
      if(editing)return '<li class="ed">'+inp(ip+'name',it.name,{ph:'Dish',label:'Dish'})+inp(ip+'desc',it.desc,{ph:'Description',label:'Description'})+inp(ip+'price',it.price,{ph:'Price',label:'Price'})+delBtn(sp+'items',ii,'dish')+'</li>';
      return '<li><div class="mi"><b>'+esc(it.name)+'</b><span class="lead"></span><span class="pr">'+esc(it.price)+'</span></div>'+(it.desc?'<p>'+esc(it.desc)+'</p>':'')+'</li>';
    }).join('');
    return '<section class="msec">'+title+'<ul>'+items+'</ul>'+(editing?addBtn(sp+'items','Add dish'):'')+'</section>';
  }).join('')+'</div>';
}

/* ---------- Info ---------- */

  var kv=S.info.map(function(r,i){var p='info.'+i+'.';

var VIEWS={roster:vRoster,upselling:vUpsell,training:vTraining,tasks:vTasks};

/* ---------- Shell ---------- */
function barHTML(){
  var st=saving?'Saving…':(msg||(dirty?'You have unsaved changes':'No changes yet'));
  return '<div class="editbar"><span class="st" role="status">'+esc(st)+'</span><div class="acts">'+
    (editing&&S.sample?'<button class="btn" data-act="clear">'+(armClear?'Click again to clear everything':'Clear sample data')+'</button><button class="btn" data-act="unsample">Hide sample label</button>':'')+
    (dirty?'<button class="btn" data-act="discard">Discard</button>':'')+
    '<button class="btn primary" data-act="save"'+((!dirty||saving)?' disabled':'')+'>Save changes</button></div></div>';
}
function renderBar(){var b=document.getElementById('bar');if(b)b.innerHTML=(editing||dirty)?barHTML():''}
function render(){
  var v=cur();
  var nav=TABS.map(function(t){return '<a href="#'+t[0]+'"'+(t[0]===v?' aria-current="page"':'')+'>'+t[1]+'</a>'}).join('');
  var right=(S.sample?'<span class="chip sample">Sample content</span>':'')+(canEdit?'<button class="btn '+(editing?'':'primary')+'" data-act="edit">'+(editing?'Done editing':'Edit page')+'</button>':'');
  app.innerHTML='<header class="band"><div class="wrap bandin"><div class="brand"><span class="kanji" aria-hidden="true">海</span><div><h1>Umi</h1></div></div><div class="bandr">'+right+'</div></div><div class="wrap"><nav class="tabs" aria-label="Sections">'+nav+'</nav></div></header>'+
    '<main class="wrap main'+((editing||dirty)?' pad-bar':'')+'">'+VIEWS[v]()+'<p class="foot">Last updated '+esc(S.meta.updated?fmt(S.meta.updated)+' '+S.meta.updated.slice(0,4):'')+'</p></main><div id="bar">'+((editing||dirty)?barHTML():'')+'</div>';
}

/* ---------- Saving ---------- */
function buildDoc(){
  var style=document.getElementById('app-style').textContent;
  var script=document.getElementById('app-script').textContent;
  var fonts=document.querySelector('link[rel="stylesheet"]');
  var json=JSON.stringify(S).replace(/</g,'\\u003c');
  return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+
    '<title>Umi Outlet Hub</title>\n<meta name="claude:viewport-fit-sides" content="cover">\n'+
    '<link rel="stylesheet" href="'+(fonts?fonts.getAttribute('href'):'')+'">\n'+
    '<style id="app-style">'+style+'</style>\n<div id="app"></div>\n'+
    '<script type="application/json" id="umi-data">'+json+'<\/script>\n'+
    '<script id="app-script">'+script+'<\/script></body></html>';
}
async function save(){
  if(saving||!dirty||!art)return;
  if(document.activeElement&&document.activeElement.blur)document.activeElement.blur();
  saving=true;msg='';renderBar();
  S.meta.updated=todayISO();
  try{await art.publish(buildDoc())}
  catch(err){
    saving=false;
    var c=err&&err.code;
    if(c==='conflict')msg='Someone saved a newer version first. Reloading…';
    else if(['not_writer','not_granted','consent_required','not_declared'].indexOf(c)>-1){canEdit=false;editing=false;msg='';}
    else msg='Save did not go through. Check your connection and try again.';
    render();
  }
}

/* ---------- Events ---------- */
app.addEventListener('input',function(e){
  var t=e.target,p=t.dataset&&t.dataset.p;if(!p||t.dataset.r)return;
  if(t.tagName==='TEXTAREA')t.rows=Math.max(3,t.value.split('\n').length);
  setP(p,t.value);dirty=true;msg='';
  if(p.indexOf('upsell.')===0){var u=document.getElementById('upstats');if(u)u.innerHTML=upStats()}
  renderBar();
});
app.addEventListener('change',function(e){
  var t=e.target,p=t.dataset&&t.dataset.p;if(!p||!t.dataset.r)return;
  if(p==='roster.weekOf'&&!t.value)return;
  setP(p,t.value);dirty=true;msg='';render();
});
document.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.dataset.act;
  if(a==='edit'){editing=!editing;armClear=false;msg='';render();return}
  if(a==='add'){var l=getP(b.dataset.list);var key=b.dataset.list.split('.').pop();if(l&&NEW[key]){l.push(NEW[key]());dirty=true;msg='';render()}return}
  if(a==='del'){var l2=getP(b.dataset.list);if(l2){l2.splice(+b.dataset.i,1);dirty=true;msg='';render()}return}
  if(a==='tstatus'){var tx=S.trainings[+b.dataset.i];if(tx){tx.status=tstat(tx)==='completed'?'pending':'completed';dirty=true;msg='';render()}return}
  if(a==='tick'){var k=b.dataset.k;if(S.done[k])delete S.done[k];else S.done[k]=true;dirty=true;msg='';render();return}
  if(a==='save'){save();return}
  if(a==='discard'){S=JSON.parse(orig);dirty=false;msg='';armClear=false;render();return}
  if(a==='unsample'){S.sample=false;dirty=true;render();return}
  if(a==='clear'){
    if(!armClear){armClear=true;renderBar();return}
    armClear=false;S.sample=false;

});
